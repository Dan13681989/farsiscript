name: Run FarsiScript Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests
        run: |
          python -m unittest farsiscript.tests.test_stdlib_extended -v

      - name: Quick compile smoke test
        run: |
          echo 'چاپ "CI works!";' > test_ci.fs
          python -m farsiscript.compiler test_ci.fs
          ./test_ci
